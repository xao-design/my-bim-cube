<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Parametric Grid</title>
    <style>
        /* 1. Reset the page so the 3D canvas fills the whole screen */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* 2. The container that holds both Three.js and the CSS2D Renderer */
        #viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 3. The CAD UI Panel */
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10; /* Make sure this stays on top of the 3D canvas! */
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;
            backdrop-filter: blur(5px);
        }

        .controls label {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }

        .controls span {
            color: #00d1b2;
            font-weight: bold;
        }

        .controls input[type=range] {
            width: 100%;
            accent-color: #00d1b2;
            cursor: pointer;
        }

        .controls button {
            background-color: #00d1b2;
            color: #111;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls button:hover {
            background-color: #00e6c3;
        }

        /* 4. The Floating 3D Text Labels */
        .grid-label {
            color: #00d1b2;
            font-family: monospace;
            font-size: 12px;
            padding: 2px 4px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 3px;
            border: 1px solid #00d1b2;
            margin-top: -1em; /* Centers the label slightly above the grid dot */
            
            /* THIS IS CRITICAL: It allows your mouse to click 'through' the text so you can still orbit the camera */
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="viewer"></div>

    <div class="controls">
        <label>Height: <span id="valHeight">2.0</span>m</label>
        <input type="range" id="heightSlider" min="0.5" max="10" step="0.1" value="2.0">

        <hr style="margin: 10px 0; border-color: #444; width: 100%;">

        <label>Total Width (X): <span id="valWidth">16.0</span>m</label>
        <input type="range" id="widthSlider" min="16" max="50" step="0.5" value="12.0">

        <label>Total Depth (Y): <span id="valDepth">6.0</span>m</label>
        <input type="range" id="depthSlider" min="6" max="50" step="0.5" value="6.0">

        <button id="exportBtn" style="margin-top: 10px;">Export IFC</button>
    </div>

    <script type="module" src="/main.js"></script>

</body>
</html>
