<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BIM Parametric Configurator</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <div id="ui">
            <h2>Configurator</h2>
            <div class="control-group">
                <label>Height: <span id="val">2.0</span>m</label>
                <input type="range" id="heightSlider" min="0.5" max="10" step="0.1" value="2">
            </div>
            <button id="exportBtn">Export IFC</button>
        </div>
        <div id="viewer"></div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
